; https://docs.platformio.org/page/projectconf.html

[env:ttgo-t7-v14-mini32]
platform = espressif32
board = ttgo-t7-v14-mini32
framework = arduino
monitor_speed = 115200
lib_deps =
	adafruit/DHT sensor library @ ^1.4.6
	bblanchon/ArduinoJson @ ^7.0.4
	256dpi/MQTT @ ^2.5.2
